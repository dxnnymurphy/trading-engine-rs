[package]
name = "trading-engine-rs"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.5.55", features = ["cargo", "derive", "env"] }
common = { path = "./common" }
env_logger = "0.11.8"
figment = { version = "0.10.19", features = ["env", "test", "toml"] } 
futures-util = "0.3.31"
log = "0.4.29"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
slotmap = "1.0.7"
thiserror = "2.0.18"
tokio = { version = "1.49.0", features = ["macros", "rt-multi-thread", "sync", "time"] }
tokio-tungstenite = { version = "0.28.0", features = ["native-tls"] }

[dev-dependencies]
criterion = "0.5.1"

[[bench]]
name = "orderbook_bench"
harness = false
